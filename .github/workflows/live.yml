name: Live status

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the live block
        run: python3 scripts/live.py
      - name: Commit if it moved
        run: |
          if git diff --quiet README.md; then
            echo "nothing moved"
            exit 0
          fi
          git config user.name "tempoloss"
          git config user.email "me@an8kk.dev"
          git add README.md
          git commit -m "live: refresh status block"
          git push
